# ============================================================
#  تنظیمات گزارش تماس - Samsung Call Report
#  (خطوطی که با # شروع می‌شوند توضیح هستند)
# ============================================================

# ایمیلی که گزارش به آن ارسال می‌شود
ToEmail=m.javadtt@yahoo.com

# ایمیلی که گزارش از آن ارسال می‌شود (همان یاهوی خودتان)
SenderEmail=m.javadtt@yahoo.com

# (اختیاری) ایمیل مدیر: اگر پر شود، فقط فایل «تماس‌های کاری» برای مدیر هم ارسال می‌شود
ManagerEmail=

# بازه گزارش به روز (۳ ماه = ۹۰ روز)
Days=90

# هر چند روز یک‌بار گزارش خودکار ارسال شود
SendEveryDays=30

# ساعتی که ویندوز هر روز بررسی می‌کند آیا وقت ارسال گزارش رسیده یا نه
ScheduleTime=12:00

# اگر اسم مخاطب شامل یکی از این کلمات باشد، تماس «کاری» حساب می‌شود (با ویرگول جدا کنید)
WorkKeywords=کار,شرکت,مشتری,همکار,دفتر,اداره,مهندس,Work,Office,Client

# شماره‌های ناشناس (ذخیره‌نشده در مخاطبین) کاری حساب شوند؟ yes / no
UnknownNumbersAreWork=no

# بعد از اولین اتصال با کابل، گوشی از طریق وای‌فای هم در دسترس باشد تا ارسال خودکار بدون کابل انجام شود؟ yes / no
WirelessAdb=yes

# سرور ایمیل (برای یاهو نیازی به تغییر نیست؛ خالی = تشخیص خودکار)
SmtpHost=
SmtpPort=587
